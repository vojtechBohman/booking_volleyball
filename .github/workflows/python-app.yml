name: Test Court Booking Automation

on:
  workflow_dispatch: # Manual execution only for testing

# --- THE FIX: Forcing GitHub to run all JavaScript actions on Node.js 24 ---
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test-booking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run booking script
        env:
          BOOKING_USERNAME: ${{ secrets.BOOKING_USERNAME }}
          BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
        run: python booking_volleyball.py

      # This step runs ONLY if the previous script fails
      - name: Upload debugging screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: booking_error_screenshot.png
          retention-days: 3
